<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChemLimit</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup">
      <header>
        <img src="../icons/icon32.png" alt="" width="32" height="32">
        <div>
          <h1>ChemLimit</h1>
          <p>VLEP italiani e fonti OEL internazionali da CAS o nome sostanza.</p>
        </div>
      </header>

      <form id="popupForm">
        <label for="popupSearch">CAS o nome sostanza</label>
        <input id="popupSearch" type="search" autocomplete="off" placeholder="acetone">
        <button type="submit">Apri side panel</button>
      </form>
      <p id="popupStatus" class="status" aria-live="polite"></p>

      <footer class="support-footer">
        <a
          href="https://buymeacoffee.com/Vale71"
          target="_blank"
          rel="noopener noreferrer"
        >
          If ChemLimit saves you time, you can buy me a coffee.
        </a>
      </footer>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
